<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BWN Video Library</title>
<meta name="description" content="Basheera Wa Nazeera talks in Bangla and English: watch and listen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Amiri&display=swap">
<style>
/* Layout: library catalogue — a numbered folder map on the left (like "The MAP"), the open post on the right; stacks on phones. */
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0}
:root{
  --bg:#f3f5f3; --panel:#ffffff; --ink:#1d2a27; --muted:#5d6b67; --line:#d9e0dc;
  --accent:#1f5c4d; --accent-soft:#e2eeea; --gold:#8a6a1f; --private:#7a3b2e; --private-soft:#f6e9e5;
  --f-display:"Marcellus", Georgia, serif;
  --f-body:"Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-ar:"Amiri", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2c3835;
  --accent:#7fc4b0; --accent-soft:#1f3530; --gold:#d6b46a; --private:#e59a88; --private-soft:#3a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --ink:#e3ebe8; --muted:#9aa9a4; --line:#2c3835;
  --accent:#7fc4b0; --accent-soft:#1f3530; --gold:#d6b46a; --private:#e59a88; --private-soft:#3a2420; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px}
.seg button{font:inherit;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg button:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.demo{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
.demo b{color:var(--ink);font-weight:600}
.understood{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.understood div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem;min-width:0}
.understood strong{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:500}
.main{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.map,.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.map{padding:14px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.map h2{font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin:0 4px 2px}
.oc{display:flex;gap:10px;align-items:center;margin:0 4px 10px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.oc button{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.oc .sp{flex:1}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;border-left:1px dotted var(--line);padding-left:8px}
.row{display:flex;align-items:baseline;gap:6px;padding:3px 4px;border-radius:6px;cursor:pointer;user-select:none}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.tw{width:12px;flex:none;color:var(--muted);font-family:var(--f-mono);font-size:.75rem}
.rng{font-family:var(--f-mono);font-size:.74rem;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.nm{min-width:0;overflow-wrap:anywhere}
.sec>.row .nm{font-weight:600;letter-spacing:.02em;text-transform:uppercase;font-size:.82rem}
.cnt{color:var(--muted);font-size:.8rem;flex:none}
.kind{font-family:var(--f-mono);font-size:.66rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);flex:none;letter-spacing:.04em}
.lock{font-size:.7rem;color:var(--private);border:1px solid currentColor;border-radius:4px;padding:0 4px;flex:none;font-family:var(--f-mono)}
.post{padding:22px clamp(16px,3vw,32px) 28px;display:grid;gap:16px}
.crumb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.03em}
.post h2{font-family:var(--f-display);font-weight:400;font-size:1.65rem;line-height:1.25;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.78rem;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--muted)}
.chip.pub{border-color:var(--accent);color:var(--accent)}
.chip.draft{border-color:var(--gold);color:var(--gold)}
.chip.priv{border-color:var(--private);color:var(--private)}
.media{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.9rem;border-radius:8px;padding:8px 14px;border:1px solid var(--accent);color:var(--accent);background:transparent;text-decoration:none;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--panel)}
.btn svg{width:16px;height:16px;fill:currentColor}
.bis{font-family:var(--f-ar);font-size:1.35rem;direction:rtl;text-align:center;color:var(--accent)}
.text{max-width:68ch;display:grid;gap:10px}
.text p{margin:0}
.text .ts{font-family:var(--f-mono);font-size:.74rem;color:var(--gold);margin-right:6px}
.text[contenteditable="true"]{outline:2px dashed var(--gold);outline-offset:6px;border-radius:4px}
.privbox{border:1px solid var(--private);background:var(--private-soft);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.privbox h3{margin:0;font-size:.95rem;color:var(--private);font-weight:600}
.privbox .note{font-size:.82rem;color:var(--muted);margin:0}
.files{width:100%;border-collapse:collapse;font-size:.86rem}
.files td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.files td.sz{font-family:var(--f-mono);font-size:.78rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.files .pick{color:var(--accent);font-weight:600}
.tablebox{overflow-x:auto}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.88rem}
.tools select{font:inherit;font-size:.86rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.toast{font-size:.84rem;color:var(--accent);min-height:1.2em}
.empty{color:var(--muted);font-size:.9rem}
footer{font-size:.8rem;color:var(--muted)}
@media (max-width:860px){.understood{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:minmax(0,1fr)}.map{position:static}}
@media (max-width:420px){.understood{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s}}

.auth{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.auth button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:999px;padding:4px 12px;cursor:pointer}
.ownerform{display:grid;gap:8px;max-width:420px}
.ownerform input,.ownerform select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.post .note{font-size:.82rem;color:var(--muted);margin:0}
.files a,footer a{color:var(--accent)}
.linkin{font:inherit;font-size:.86rem;flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Basheera Wa Nazeera · Video Library</h1>
      <p>Talks in Bangla and English: watch and listen</p>
    </div>
    <div class="auth">
      <div class="seg" role="group" aria-label="Who is looking" id="seg" hidden>
        <button id="v-pub" aria-pressed="true">Visitor view</button>
        <button id="v-own" aria-pressed="false">My view (private)</button>
      </div>
      <span id="who"></span>
      <button id="signin">Sign in</button>
      <button id="signout" hidden>Sign out</button>
    </div>
  </header>

  <div class="demo" id="banner" hidden></div>

  <div class="main">
    <nav class="map" aria-label="Folder map">
      <h2>The Map</h2>
      <div class="oc"><button id="openall">open all</button>|<button id="closeall">close all</button><span class="sp"></span><button id="newpost" hidden>+ new post</button><button id="newfolder" hidden>+ new folder</button></div>
      <ul class="tree" id="tree"></ul>
    </nav>
    <article class="post" id="post" aria-live="polite"><p class="empty">Loading…</p></article>
  </div>

  <footer>Basheera Wa Nazeera · <a href="https://www.youtube.com/@BasheeraWaNazeera" target="_blank" rel="noopener">youtube.com/@BasheeraWaNazeera</a></footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BwN Library page</title>
<!-- BwN Library page viewer (BWN J27, owner's C, 2 Nov 2026): opens one page kept in the Library,
     outside Claude. Private pages need the owner's sign-in; pages shown to visitors open for anyone. -->
<style>
:root{--bg:#f4f5f1;--panel:#fff;--ink:#1d2420;--muted:#5d6a63;--line:#d9ded8;--accent:#1f5c47}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1b201d;--ink:#e6ebe7;--muted:#9aa79f;--line:#2e3631;--accent:#7cc4a0}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1b201d;--ink:#e6ebe7;--muted:#9aa79f;--line:#2e3631;--accent:#7cc4a0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.msg{max-width:440px;margin:18vh auto 0;padding:24px 20px;margin-left:max(16px,calc(50% - 220px));margin-right:max(16px,calc(50% - 220px));background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center}
.msg h1{font-size:1.15rem;margin:0 0 8px}
.msg p{color:var(--muted);margin:0 0 16px}
.msg button,.msg a.b{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:999px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.msg a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="msg" id="msg"><p>Opening…</p></div>
<script type="module">
import { firebaseConfig } from "./config.js";
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const key = (new URLSearchParams(location.search).get("p") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 120);
const anchor = decodeURIComponent(location.hash.slice(1));
const msg = document.getElementById("msg");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const say = (h, p, btn) => { msg.hidden = false; msg.innerHTML = `<h1>${esc(h)}</h1><p>${p}</p>${btn || ""}<p style="margin:16px 0 0;font-size:.85rem"><a href="./">BwN Video Library</a></p>`; };

// Stand-in for Claude's page features, so a page copied out of Claude keeps working (BWN J27).
// db: reads the copy of the page's data saved with it (changes last until the page is closed);
// downloads: saves files to this device; artifact: saving the page itself stays in Claude.
const SHIM = `(function(){
  var L={}, SEED=function(){return window.__BWN_SEED||{}}, RO=false;
  function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x));}
  function store(c){var S=SEED();return S[c]||(S[c]={});}
  function snapDoc(c,id){var d=store(c)[id];return {id:id,exists:d!==undefined,data:function(){return clone(d);},get:function(k){return d?clone(d[k]):undefined;},ref:{id:id}};}
  function colSnap(c,ch){var docs=Object.keys(store(c)).map(function(id){return snapDoc(c,id);});
    return {docs:docs,size:docs.length,empty:!docs.length,forEach:function(f){docs.forEach(f);},docChanges:function(){return ch||docs.map(function(d){return {type:"added",doc:d};});}};}
  function fire(c,id,type){note();(L[c]||[]).forEach(function(f){f(colSnap(c,[{type:type,doc:snapDoc(c,id)}]));});(L[c+"/"+id]||[]).forEach(function(f){f(snapDoc(c,id));});}
  function on(k,f){(L[k]=L[k]||[]).push(f);return function(){L[k]=(L[k]||[]).filter(function(g){return g!==f;});};}
  function docRef(path){var p=String(path).split("/"),id=p.pop(),c=p.join("/");
    return {id:id,path:path,get:function(){return Promise.resolve(snapDoc(c,id));},
      onSnapshot:function(f){setTimeout(function(){f(snapDoc(c,id));});return on(c+"/"+id,f);},
      set:function(d,o){var t=store(c),had=t[id]!==undefined;t[id]=o&&o.merge?Object.assign({},t[id]||{},clone(d)):clone(d);fire(c,id,had?"modified":"added");return Promise.resolve();},
      update:function(d){var t=store(c);t[id]=Object.assign({},t[id]||{},clone(d));fire(c,id,"modified");return Promise.resolve();},
      delete:function(){var t=store(c);if(t[id]===undefined)return Promise.resolve();var old=snapDoc(c,id);delete t[id];note();(L[c]||[]).forEach(function(f){f(colSnap(c,[{type:"removed",doc:old}]));});(L[c+"/"+id]||[]).forEach(function(f){f(snapDoc(c,id));});return Promise.resolve();},
      collection:function(n){return col(path+"/"+n);}};}
  function col(c){return {id:c,doc:function(id){return docRef(c+"/"+(id||Math.random().toString(36).slice(2)));},
    add:function(d){var r=docRef(c+"/"+Math.random().toString(36).slice(2));return r.set(d).then(function(){return r;});},
    get:function(){return Promise.resolve(colSnap(c));},
    onSnapshot:function(f){setTimeout(function(){f(colSnap(c));});return on(c,f);}};}
  var noted=false;function note(){if(noted)return;noted=true;var b=document.createElement("div");
    b.textContent="Copy outside Claude: changes made here are not kept after you close the page.";
    b.style.cssText="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:2147483647;background:#1d2420;color:#fff;font:13px system-ui,sans-serif;padding:7px 14px;border-radius:999px;max-width:calc(100vw - 24px);box-shadow:0 4px 14px rgba(0,0,0,.25)";
    document.body.appendChild(b);setTimeout(function(){b.remove();},8000);}
  var db={collection:col,doc:docRef};
  var dl={save:function(o){o=o||{};var data=o.data,blob=data instanceof Blob?data:new Blob([typeof data==="string"?data:data instanceof ArrayBuffer||ArrayBuffer.isView(data)?data:JSON.stringify(data)],{type:o.type||o.mimeType||"application/octet-stream"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=o.filename||o.name||"download";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);return Promise.resolve();}};
  var art={publish:function(){return Promise.reject({code:"unavailable",message:"Saving a new version of this page is done in its Claude copy."});}};
  window.claude={use:function(n){return n==="db"?Promise.resolve(db):n==="downloads"?Promise.resolve(dl):n==="artifact"?Promise.resolve(art):Promise.reject({code:"unavailable",message:n+" is only in the Claude copy."});}};
})();`;
function show(d) {
  document.title = d.name || "BwN Library page";
  const jump = anchor ? `<script>try{const e=document.getElementById(${JSON.stringify(anchor)});if(e)e.scrollIntoView();}catch(e){}<\/script>` : "";
  const f = document.createElement("iframe");
  f.title = d.name || "Page";
  f.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads allow-top-navigation-by-user-activation");
  f.setAttribute("allow", "clipboard-write; fullscreen");
  let html = String(d.html || "");
  const tag = "<script>" + (anchor ? "try{history.replaceState(null,'','#'+" + JSON.stringify(anchor) + ");}catch(e){}" : "") + SHIM + "<\/script>";
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + tag) : tag + html;
  f.srcdoc = html.replace(/<\/body>(?![\s\S]*<\/body>)/i, jump + "</body>") + (/<\/body>/i.test(html) ? "" : jump);
  msg.hidden = true; document.body.append(f);
}

if (!key) say("No page chosen", "Open a page from its card in the Video Library.");
else {
  const [{ initializeApp }, fs, au] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js"), import(FB + "firebase-auth.js")]);
  const app = initializeApp(firebaseConfig), db = fs.getFirestore(app), auth = au.getAuth(app);
  let shown = false, tried = false;
  const load = async () => {
    try { const s = await fs.getDoc(fs.doc(db, "pages", key));
      if (!s.exists()) return say("Page not found", "This page is not in the Library (it may have been removed)."), true;
      shown = true; show(s.data()); return true;
    } catch (e) { return false; }
  };
  au.onAuthStateChanged(auth, async u => {
    if (shown) return;
    if (await load()) return;
    if (!u) say("This page is private", "Only the owner can open it. Sign in with the owner's Google account.", `<button id="si" type="button">Sign in with Google</button>`);
    else say("This page is private", `${esc(u.email)} cannot open it. Sign in with the owner's account.`, `<button id="si" type="button">Use another account</button>`);
    const b = document.getElementById("si");
    if (b) b.onclick = async () => { try { await au.signInWithPopup(auth, new au.GoogleAuthProvider()); } catch (e) { say("Sign-in did not finish", esc(e.message)); } };
    tried = true;
  });
}
</script>
</body>
</html>
